server:
  port: 8081
  servlet:
    context-path: /myblog
spring:
  application:
    name: myblog
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/myblog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Cjw18476714119
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    property-naming-strategy: SNAKE_CASE # 支持下划线命名转驼峰
mybatis-plus:
  type-aliases-package: chenliao.entity # 别名扫描包
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
logging:
  level:
    com.chenliao.chenliaoblog:
      mapper: DEBUG
      service: INFO
      controller: INFO
  pattern:
    dateformat: mm:ss.SSS
mybatis:
  #config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath:mapper/*.xml